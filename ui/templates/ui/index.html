{% extends "ui/base.html" %}

{% block content %}
  <div class="navbar bg-base-100/50">
    <div class="flex-1">
      <a class="btn btn-ghost normal-case text-2xl font-bold">Leecher</a>
    </div>
    <div class="flex-none">
      <!-- Dark mode switch -->
      <label class="swap swap-rotate btn btn-ghost btn-circle">
        <input type="checkbox" id="dark-mode-toggle" />
        <svg id="darklink" class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29l.71-.71a1,1,0,0,0-1.41-1.41l-.71.71A1,1,0,0,0,5.64,7.05ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM20,12a1,1,0,0,0-1-1H18a1,1,0,0,0,0,2h1A1,1,0,0,0,20,12ZM17,5.64a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29l.71-.71a1,1,0,0,0-1.41-1.41l-.71.71A1,1,0,0,0,17,5.64ZM12,8a4,4,0,1,0,4,4A4,4,0,0,0,12,8Zm0,6a2,2,0,1,1,2-2A2,2,0,0,1,12,14Z"/></svg>
        <svg id="lightlink" class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13.24a1.05,1.05,0,0,0-.7.24l-1.74,1.74a1,1,0,0,0,1.41,1.41l1.74-1.74a1,1,0,0,0-.71-1.65Z M13,22a1,1,0,0,0,1-1V19a1,1,0,0,0-2,0v2A1,1,0,0,0,13,22Z M6,13a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H5A1,1,0,0,0,6,13Z M6.34,6.34A1,1,0,0,0,7.76,4.93L6.34,3.52A1,1,0,0,0,4.93,4.93Z M19.07,4.93a1,1,0,0,0-1.41,0l-1.42,1.42a1,1,0,0,0,1.41,1.41Z M12,2a1,1,0,0,0-1,1V5a1,1,0,0,0,2,0V3A1,1,0,0,0,12,2Z M12,7a5,5,0,1,0,5,5A5,5,0,0,0,12,7Zm0,8a3,3,0,1,1,3-3A3,3,0,0,1,12,15Z"/></svg>
      </label>

      <!-- New Task Button -->
      <label for="new_task_modal" class="btn btn-primary ml-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        New Task
      </label>
    </div>
  </div>

  <div id="errors"></div>

  <!-- New Task Modal -->
  <input type="checkbox" id="new_task_modal" class="modal-toggle" />
  <div class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
      {% include "ui/new_task_form.html" %}
      <div class="modal-action">
        <label for="new_task_modal" class="btn">Close</label>
      </div>
    </div>
  </div>

  <!-- tasks -->
  <div class="mt-6" hx-trigger="taskListChanged from:body"
       hx-get="{% url 'task_list' %}?per_page={{ request.GET.per_page }}&page={{ request.GET.page }}" hx-target="this">
    {% include "ui/task_list.html" %}
  </div>
{% endblock %}
