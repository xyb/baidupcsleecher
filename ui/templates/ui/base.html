<!doctype html>
<html data-theme="cupcake">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Baidu Cloud Storage Leecher{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha384-zMEydMdp5mC+i11DwQRMHxzvFhmCbjZtR+KrIUQRc1uJJCq7NTXDSHVLozUvqPEB" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <script src="https://unpkg.com/htmx.org@1.9.5"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/debug.js"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/response-targets.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.5.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body hx-ext="debug" class="bg-base-200 min-h-screen">
    <div hx-ext="response-targets" class="container mx-auto p-4 max-w-5xl">
      {% block content %}{% endblock %}
    </div>

    <footer class="mt-auto">
      {% block footer %}{% endblock %}
    </footer>
  </body>

  <script>
    document.body.addEventListener('htmx:configRequest', (event) => {
      event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
    });

    document.addEventListener('DOMContentLoaded', () => {
      const themeToggle = document.getElementById('dark-mode-toggle');
      if (!themeToggle) return;

      const lightTheme = 'cupcake';
      const darkTheme = 'dracula';

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        themeToggle.checked = theme === darkTheme;
      }

      themeToggle.addEventListener('change', () => {
        setTheme(themeToggle.checked ? darkTheme : lightTheme);
      });

      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme) {
        setTheme(savedTheme);
      } else if (prefersDark) {
        setTheme(darkTheme);
      } else {
        setTheme(lightTheme);
      }
    });
  </script>
</html>
